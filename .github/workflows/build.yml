name: Build SORASUKKK APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project files
        run: |
          if [ ! -f settings.gradle ]; then
            echo "include ':app'" > settings.gradle
          fi
          if [ ! -f build.gradle ]; then
            cat > build.gradle << 'EOF'
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:8.2.0'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            EOF
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            mkdir -p gradle/wrapper
            echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew :app:assembleRelease --no-daemon || gradle :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SORASUKKK-APK
          path: app/build/outputs/apk/release/*.apk
